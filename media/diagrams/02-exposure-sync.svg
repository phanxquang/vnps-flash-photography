<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" rx="36" fill="#0b2025"/><text x="60" y="75" fill="#efbd59" font-family="Arial" font-size="28" font-weight="700">EXPOSURE CONTROLS &amp; SYNC SPEED</text><g font-family="Arial"><g transform="translate(70 130)"><rect width="500" height="390" rx="24" fill="#fffdf7"/><text x="35" y="55" fill="#247c7c" font-size="24" font-weight="700">Ambient exposure</text><text x="35" y="110" fill="#172225" font-size="21">Shutter speed</text><rect x="220" y="84" width="230" height="34" rx="17" fill="#d7cfbe"/><rect x="220" y="84" width="170" height="34" rx="17" fill="#dd7135"/><text x="35" y="180" fill="#172225" font-size="21">Aperture</text><rect x="220" y="154" width="230" height="34" rx="17" fill="#d7cfbe"/><rect x="220" y="154" width="145" height="34" rx="17" fill="#efbd59"/><text x="35" y="250" fill="#172225" font-size="21">ISO</text><rect x="220" y="224" width="230" height="34" rx="17" fill="#d7cfbe"/><rect x="220" y="224" width="145" height="34" rx="17" fill="#247c7c"/><text x="35" y="325" fill="#607074" font-size="18">Below sync speed, shutter speed is</text><text x="35" y="355" fill="#607074" font-size="18">the cleanest background control.</text></g><g transform="translate(630 130)"><rect width="500" height="390" rx="24" fill="#fffdf7"/><text x="35" y="55" fill="#247c7c" font-size="24" font-weight="700">Flash exposure</text><text x="35" y="110" fill="#172225" font-size="21">Flash power / FEC</text><rect x="240" y="84" width="210" height="34" rx="17" fill="#d7cfbe"/><rect x="240" y="84" width="185" height="34" rx="17" fill="#dd7135"/><text x="35" y="180" fill="#172225" font-size="21">Distance</text><rect x="240" y="154" width="210" height="34" rx="17" fill="#d7cfbe"/><rect x="240" y="154" width="170" height="34" rx="17" fill="#efbd59"/><text x="35" y="250" fill="#172225" font-size="21">Aperture &amp; ISO</text><rect x="240" y="224" width="210" height="34" rx="17" fill="#d7cfbe"/><rect x="240" y="224" width="140" height="34" rx="17" fill="#247c7c"/><text x="35" y="325" fill="#607074" font-size="18">Normal sync is often 1/160–1/250 s.</text><text x="35" y="355" fill="#607074" font-size="18">Above it: enable HSS or expect a dark band.</text></g><rect x="265" y="570" width="670" height="60" rx="30" fill="#efbd59"/><text x="600" y="608" text-anchor="middle" fill="#0b2025" font-size="22" font-weight="700">START: ISO 100–400 · f/4–f/8 · 1/60–1/200 s</text></g></svg>
