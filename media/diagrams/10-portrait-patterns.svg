<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" rx="36" fill="#0b2025"/><text x="60" y="72" fill="#efbd59" font-family="Arial" font-size="28" font-weight="700">ONE LIGHT · FOUR CLASSIC PATTERNS</text><g font-family="Arial" text-anchor="middle"><g transform="translate(55 135)"><rect width="250" height="430" rx="24" fill="#fffdf7"/><circle cx="125" cy="160" r="75" fill="#f0c6a5"/><circle cx="65" cy="80" r="26" fill="#efbd59"/><path d="M80 110L110 155" stroke="#dd7135" stroke-width="5"/><text x="125" y="300" fill="#247c7c" font-size="28" font-weight="700">LOOP</text><text x="125" y="345" fill="#607074" font-size="17">30–45° to side</text></g><g transform="translate(335 135)"><rect width="250" height="430" rx="24" fill="#fffdf7"/><circle cx="125" cy="160" r="75" fill="#f0c6a5"/><path d="M125 85a75 75 0 0 1 70 100q-38-35-70-25z" fill="#6b4a3c" opacity=".65"/><circle cx="40" cy="125" r="26" fill="#efbd59"/><text x="125" y="300" fill="#247c7c" font-size="28" font-weight="700">REMBRANDT</text><text x="125" y="345" fill="#607074" font-size="17">Triangle on shadow cheek</text></g><g transform="translate(615 135)"><rect width="250" height="430" rx="24" fill="#fffdf7"/><circle cx="125" cy="160" r="75" fill="#f0c6a5"/><path d="M125 85a75 75 0 0 1 0 150z" fill="#263e46" opacity=".85"/><circle cx="25" cy="160" r="26" fill="#efbd59"/><text x="125" y="300" fill="#247c7c" font-size="28" font-weight="700">SPLIT</text><text x="125" y="345" fill="#607074" font-size="17">Approximately 90°</text></g><g transform="translate(895 135)"><rect width="250" height="430" rx="24" fill="#fffdf7"/><circle cx="125" cy="160" r="75" fill="#f0c6a5"/><path d="M110 165q15 35 30 0" fill="#805849" opacity=".7"/><circle cx="125" cy="45" r="26" fill="#efbd59"/><text x="125" y="300" fill="#247c7c" font-size="28" font-weight="700">BUTTERFLY</text><text x="125" y="345" fill="#607074" font-size="17">Centered and above</text></g><text x="600" y="625" fill="#b8cccc"